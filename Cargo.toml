[package]
name = "aion-transporter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14"
anyhow = "1.0"
tracing = "0.1"
rustls = { version="0.23", features=["ring"]}
rustls-pemfile = "1.0"
dotenv = "0.15.0"
